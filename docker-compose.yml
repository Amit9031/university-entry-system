services:
  # ============================================================================
  # University Gate Entry Application (Spring Boot)
  # ============================================================================
  app:
    build: .
    container_name: university-gate-entry
    restart: always
    ports:
      - "9090:9090"
    environment:
      - PORT=9090
      - SPRING_DATA_MONGODB_URI=mongodb://admin:adminpassword@mongodb:27017/university_gate_db?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - university-network

  # ============================================================================
  # MongoDB Database Server (with automated mongosh init)
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: university-gate-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
      - MONGO_INITDB_DATABASE=university_gate_db
    volumes:
      # Persistent database storage
      - mongodb_data:/data/db
      # Auto-run mongosh initialization scripts on container startup
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - university-network

  # ============================================================================
  # Mongo Express - Web UI for MongoDB Inspection (CA Demo Friendly)
  # Access at: http://localhost:8081
  # ============================================================================
  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: university-gate-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=adminpassword
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - university-network

volumes:
  mongodb_data:
    name: university_gate_mongodb_data

networks:
  university-network:
    name: university-gate-network
    driver: bridge
